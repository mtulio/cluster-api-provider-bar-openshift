# Provider payload descriptor for the Bar reference implementation.
#
# This file is the OpenShift-specific half of the payload contract. The other
# half is clusterctl's own metadata.yaml, which sits next to this file at the
# payload root and is fetched verbatim from the provider's release assets by
# the Containerfile. metadata.yaml answers "which Cluster API contract does this
# provider release implement"; it says nothing about Kubernetes versions,
# nothing about where the controller binary or the hooks live, and nothing
# about the controller's command line, because none of those concepts exist
# upstream. That residue is what this file carries.
#
# Everything here describes structure. The installer validates that the
# declared layout is present and that the compatibility range admits the
# release being installed; it does not inspect, scan or attest the controller,
# the manifests or the hooks. Correctness of the content is the provider's
# responsibility, established by their release process.
#
# Bar is the second reference payload and the one that carries the evidence.
# The installer embeds CAPA, so the Foo payload cannot prove that the binary
# it was handed is the binary that ran. It does not embed CAPOCI, and cannot:
# this payload is the only demonstration that a provider the installer has
# never heard of can provision a cluster.
apiVersion: external.openshift.io/v1alpha1
kind: ExternalProviderPayload

metadata:
  # Required, and must equal platform.external.platformName in
  # install-config.yaml -- the install is refused if the two differ. Binding
  # them is what makes a payload install attributable: platformName is the
  # value that reaches Infrastructure.status.platformStatus.external, so the
  # cluster carries a record of which provider installed it.
  name: bar

  # Optional, informational, never read to decide behaviour. Build provenance
  # belongs in the image's own OCI labels -- this Containerfile sets
  # org.opencontainers.image.source and .version -- and these are the
  # declarative fallback for a provider that does not. They are written to the
  # install log, so they must carry no credential.
  #
  # Keep the revision in step with PROVIDER_VERSION in the Containerfile.
  labels:
    capi.provider.repo: https://github.com/oracle/cluster-api-provider-oci
    capi.provider.revision: v0.24.2

spec:
  # Compared against the Kubernetes version this installer binary was built
  # against. Outside this range the install is refused, before any cloud call.
  #
  # Only 1.36 (OpenShift 5.1) is exercised here. The wider band below
  # illustrates the shape of the contract; it is not a tested claim, and a
  # provider publishing a real payload is asserting something their own release
  # process has verified. CAPOCI v0.24.2 builds against Cluster API v1.11 and
  # states no Kubernetes range of its own, which is precisely the gap this
  # field fills.
  compatibility:
    kubernetes:
      min: "1.33"
      max: "1.37"

  # Everything Cluster API needs to run this provider. Paths are relative to
  # capiInstallerPath -- the directory the payload is extracted into, which
  # defaults to <install-dir>/capi-installer. A conforming payload therefore
  # needs no path configuration in install-config.yaml at all.
  #
  # Validation is exhaustive: every declared path must exist, the controller
  # must be executable, and an executable the payload did not declare is
  # rejected. An undeclared helper script is not "extra", it is a payload that
  # fails to install.
  capi:
    # Oracle's real CAPOCI manager, copied out of their released controller
    # image and renamed on the way in. The name is the same for every provider,
    # so layout validation does not have to know that this one calls its binary
    # `manager`.
    #
    # THIS USED TO BE A SHIM, and the shim is gone. The pilot's payload could
    # not point this at the manager: the installer injected --health-addr,
    # CAPOCI declares --health-probe-bind-address (main.go:100), pflag exits
    # non-zero on an unknown flag (main.go:178-180), and an appended argument
    # cannot remove an injected one. The workaround was a POSIX sh wrapper at
    # bin/controller that translated the flag and chmod'd the manager -- which
    # also forced the manager to ship as non-executable data, because the
    # descriptor had one controller slot and the wrapper was in it.
    #
    # controllerArgs below removes the whole problem: the payload names CAPOCI's
    # own flag and the installer renders the value into it, which is what every
    # integrated provider already does (pkg/clusterapi/system.go:381). The
    # wrapper was a finding against the contract, and the contract changed.
    controller: bin/controller

    # The controller's whole command line, not an addition to one. The pilot
    # injected a fixed list from inside the installer and appended the
    # provider's; append cannot remove, which is the entire reason the shim
    # above existed. The payload now owns the list outright.
    #
    # The {{...}} tokens are rendered by the installer before exec, which is
    # how a payload declares a flag whose value only the installer knows.
    # {{.WebhookPort}} and {{.WebhookCertDir}} are each required exactly once;
    # {{suggestHealthHostPort}} is optional, and omitting it means the
    # installer does not poll /healthz. --kubeconfig is appended by the
    # installer and must not be declared here.
    #
    # The first four are the set the pilot ran with -- the flags the installer
    # injected, with --health-addr spelled the way CAPOCI spells it instead of
    # translated by a wrapper.
    #
    # The fifth is a correction. This comment used to say that
    # --init-oci-clients-on-startup was "left at its default of true, which is
    # what every measured run used, because the OCIClusterIdentity supplies
    # credentials before the first reconcile". The first half was true and the
    # conclusion did not follow: CAPOCI reads AUTH_CONFIG_DIR at setup, before
    # any reconcile and therefore before any OCIClusterIdentity is consulted.
    # The pilot runs survived it only because that variable happened to be
    # exported in the shell that drove them. A payload cannot rely on the
    # operator's shell, and the first run that did not have it failed in a way
    # that named nothing useful -- see below.
    controllerArgs:
    - -v=2
    - --health-probe-bind-address={{suggestHealthHostPort}}
    - --webhook-port={{.WebhookPort}}
    - --webhook-cert-dir={{.WebhookCertDir}}
    # THE ONE PORT THE INSTALLER CANNOT CHOOSE FOR A PAYLOAD, AND THEREFORE
    # THE ONE A PAYLOAD MUST DEAL WITH ITSELF.
    #
    # CAPOCI's metrics server defaults to :8080 -- every interface, a fixed
    # port (main.go:99). The installer hands out a free port for health and
    # for the webhook, through {{suggestHealthHostPort}} and {{.WebhookPort}},
    # because it knows those flags exist; it has no token for a metrics
    # address because it does not know this provider has one. Since the
    # payload owns the whole command line, the payload owns this too.
    #
    # Measured on mrb-bar8 2026-11-10, with a teardown of the previous cluster
    # running at the same time:
    #
    #   failed to start metrics server: failed to create listener:
    #   listen tcp :8080: bind: address already in use
    #
    # The controller registered its webhooks, shut straight back down, never
    # answered /healthz, and the installer could only report a start-up
    # timeout. Two installs on one host collide, and so does anything else
    # already using 8080.
    #
    # Disabled rather than randomised: nothing scrapes a controller that lives
    # for the length of one install. The Foo payload does the same thing with
    # CAPA's spelling of it, --diagnostics-address=0.
    - --metrics-bind-address=0
    # Without this the controller exits at setup, before answering /healthz
    # once, and the installer reports only a start-up timeout:
    #
    #   E main.go:230] "auth config directory environment variable is not set"
    #
    # CAPOCI defaults --init-oci-clients-on-startup to true (main.go:153-158),
    # which makes it read AUTH_CONFIG_DIR and build one tenancy's client before
    # it reconciles anything. That default is written for how CAPOCI normally
    # runs -- a Deployment whose environment is populated from a Secret in the
    # cluster it manages.
    #
    # Neither half of that holds here. The installer runs the controller as a
    # local OS process with no such environment, and this payload authenticates
    # per cluster through the OCIClusterIdentity in ../cluster-api/cluster.yaml,
    # which points at a Secret the payload deliberately does not carry -- an
    # image holding one tenancy's API signing key is not a provider payload.
    #
    # So turning the startup client off is not a workaround for a defect. It is
    # how a provider whose credentials arrive per cluster has to be run, and it
    # is the payload's to declare because the payload owns the command line.
    # Measured on mrb-bar3, 2026-11-09.
    - --init-oci-clients-on-startup=false

    # The environment this payload cannot start without.
    #
    # Checked by the installer before the local control plane starts and
    # before any cloud resource exists. Every name here was learned the
    # expensive way: each one, left unset, produced a failure that named
    # something else and cost a run.
    #
    #   OCI_CLI_CONFIG_FILE            the oci CLI reads it implicitly, so a
    #                                  hook that is missing it fails deep
    #                                  inside an `oci` invocation
    #   OCI_PROVIDER_CREDENTIALS_FILE  the CAPOCI identity Secret. common.sh
    #                                  falls back to a path in the install
    #                                  directory that nothing creates, so the
    #                                  fallback is not a default -- it is a
    #                                  later, more confusing failure, which is
    #                                  exactly what happened on mrb-bar5
    #   OCI_IGNITION_BUCKET            hooks/ignition.sh uploads the bootstrap
    #                                  ignition into it
    #   OCI_REGION, OCI_CLI_REGION     both are read, by different code paths
    #                                  (the CCM config render and the bucket),
    #                                  and common.sh already treats each as
    #                                  mandatory with :?
    #
    # Not declared, because each has a real default: OCI_CCM_AUTH and
    # OCI_IGNITION_PAR_TTL_HOURS. Declaring a defaulted name would fail
    # installs that work.
    #
    # NOT declared either: AUTH_CONFIG_DIR. CAPOCI reads it only when
    # --init-oci-clients-on-startup is true, and this payload sets it false
    # above -- the credential arrives per cluster through the
    # OCIClusterIdentity instead. If a future payload flips that flag, this is
    # the list that has to grow.
    requiredEnv:
    - OCI_CLI_CONFIG_FILE
    - OCI_PROVIDER_CREDENTIALS_FILE
    - OCI_IGNITION_BUCKET
    - OCI_REGION
    - OCI_CLI_REGION

    # A single file, not a directory. Every clusterctl provider already
    # publishes exactly one infrastructure-components.yaml.
    #
    # Only its CustomResourceDefinitions and webhook configurations are
    # applied: the installer runs the controller as a local OS process, so the
    # Namespace, RBAC, Deployment and credentials Secret the bundle also
    # contains are never applied to the local control plane. The
    # capoci-auth-config Secret the bundle declares is inert here, and carries
    # clusterctl placeholders rather than values -- the OCIClusterIdentity in
    # cluster-api/cluster.yaml names a Secret the operator creates instead, so
    # this image holds no credential of any kind.
    infrastructureComponents: infrastructure-components.yaml

    # Cluster API objects -- Cluster, OCICluster, OCIClusterIdentity, Machine,
    # OCIMachine -- applied to the installer's local, ephemeral Cluster API
    # control plane. Nothing in this tree reaches the installed cluster.
    clusterTemplates: cluster-api/

    # spec.capi.e2e is deliberately absent. It is reserved in the API for a
    # payload to declare its own test entry point, but every declared path must
    # exist and this payload ships no bin/e2e -- declaring one it does not have
    # would fail layout validation. Nothing in the install depends on it.

  # What the OpenShift installer does beyond Cluster API. A consumer that is not
  # the installer reads manifestTemplates and ignores installerHooks, which is
  # why the hooks carry the consumer in their name.
  openshift:
    # Day-0 manifests folded into <install-dir>/manifests/ and applied by
    # bootstrap: the Oracle cloud-controller-manager and the OCI CSI driver,
    # which a platform: external cluster does not get from the release payload.
    # These do reach the installed cluster. A different destination and a
    # different lifetime from capi.clusterTemplates above, which is why the two
    # are separate keys rather than one rendered directory.
    #
    # Each file holds exactly one object: the installer counts documents in an
    # extra manifest and rejects a multi-document file
    # (pkg/asset/manifests/openshift.go:426). clusterTemplates has no such
    # limit.
    manifestTemplates: manifests/

    # Four phase scripts over a shared, non-executable lib/common.sh. The Foo
    # payload makes the same split and declares three of the four; the OCI
    # pilot used one script dispatching on OPENSHIFT_INSTALL_HOOK, which works
    # equally well. What is not optional is declaring every executable: layout
    # validation rejects an executable the descriptor does not name, which is
    # why hooks/lib/common.sh is sourced rather than run and ships without an
    # execute bit.
    #
    # Every entry is an object rather than a bare path, so the map has one
    # shape whether or not a phase needs a second field. Only ignition
    # needs one today.
    #
    # Hooks are copied verbatim, never rendered. These scripts expand
    # ${OPENSHIFT_INSTALL_INFRA_ID}, ${OCI_REGION} and others as *shell*
    # variables at run time; substituting them at render time would destroy
    # them.
    installerHooks:
      # Conditional, and most payloads will not declare it. Foo does not: CAPA
      # stages an oversized bootstrap ignition inside its own controller, via
      # AWSCluster.spec.s3Bucket, entirely downstream of anything the installer
      # reads. CAPOCI has no equivalent -- it base64-encodes machine user data
      # into instance metadata (cloud/scope/machine.go:353) and OCI caps that
      # metadata at 32,000 bytes. Because the encoding happens before the cap
      # applies, the effective ceiling is nearer 24,000 bytes of Ignition. The
      # cap is an OCI SERVICE limit rather than a check in the provider, so the
      # failure surfaces from the cloud API with a message about metadata size
      # and nothing that mentions Ignition.
      #
      # Declaring this hook requires the cluster creator's consent:
      # platform.external.clusterAPI.bootstrapIgnitionStaging must be Allowed,
      # or the install is refused at PreProvision -- before the local control
      # plane starts and before any cloud resource is created -- and again at
      # the handover itself. `create manifests` reads this descriptor earlier
      # and does not check the field, so that command accepts a non-consenting
      # install-config and `create cluster` is where it fails. It is the only
      # hook handed the cluster's day-0 secret material.
      ignition:
        program: hooks/ignition.sh
        # The file the installer reads back, relative to a directory it creates
        # for the hook and removes afterwards. The partner names the file; the
        # installer decides where it lives. It is declared rather than fixed so
        # that the installer has a name to validate and a name to put in a
        # failure message.
        #
        # It must NOT be named bootstrap.ign. That name belongs to the
        # installer's own output, which this hook never touches, and two files
        # with one name would leave no way to tell which of them a later step
        # consumed.
        #
        # The installer reads this path back because it owns the Secret the
        # provider reads from: a bootstrap Machine gets its data through
        # spec.bootstrap.dataSecretName, cluster-api/machines/10_bootstrap.yaml
        # names ${INSTALLER_INFRA_ID}-bootstrap, and only the installer creates
        # that Secret. The staged bytes have no other route to CAPOCI.
        #
        # It refuses the install if the file is absent, if it does not parse as
        # an Ignition config, or if its SHA-256 equals the input's -- the last
        # catches a hook that fails silently and copies its input, which would
        # otherwise put the full ignition back into the Secret and fail at the
        # OCI API far from the cause. Only size and SHA-256 are logged.
        bootstrapOutputPath: bootstrap-staged.ign
      # Creates api/api-int DNS; adds the 22623 listener and its backend set to
      # the API load balancer, which CAPOCI has no field for; and writes the CCM
      # and CSI config, whose inputs are OCIDs that do not exist until Cluster
      # API has built the network -- which is why they cannot be day-0 manifests.
      infraReady:
        program: hooks/infra-ready.sh
      # Publishes *.apps, and fills the 22623 backend set infraReady created --
      # which means naming control-plane addresses, so it cannot happen until
      # the machines have booted.
      postProvision:
        program: hooks/post-provision.sh
      # Removes everything the other three created, including the staged
      # ignition object and the pre-authenticated request over it. None of it is
      # owned by a Cluster API object, so deleting the Cluster would leave all
      # of it behind.
      preDestroy:
        program: hooks/pre-destroy.sh
